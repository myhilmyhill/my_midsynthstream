services:
  synthesizer:
    build: synthesizer
    volumes:
      - /run/user/1000/pipewire-0:/tmp/pipewire-0
      - ./synthesizer/ini/rtpmidid.ini:/etc/rtpmidid/rtpmidid.ini
      - sockets:/sockets
    devices:
      - /dev/snd
    environment:
      XDG_RUNTIME_DIR: /tmp
      MIDI_OUT_PORT: "24"
      CAPTURE_DEVICE: "hw:1,0"
    ports:
      - "5004:5004/udp"
      - "5005:5005/udp"
    healthcheck:
      test: lsof | grep /sockets/pcm_socket || exit 1
      interval: 10s
      retries: 100
      start_period: 3m
      timeout: 10s

  streamer:
    build: streamer
    depends_on:
      synthesizer:
        condition: service_healthy
        required: false
    volumes:
      - sockets:/sockets
    entrypoint: |
      sh -c "socat UNIX-CONNECT:/sockets/pcm_socket - | ffmpeg -f s16le -ar 44100 -ac 2 -i - -c:a pcm_s16be -f rtp rtp://${RTP_HOST}:${RTP_PORT}"
    ports:
      - "${RTP_PORT}:${RTP_PORT}/udp"

volumes:
  sockets:
    driver: local
